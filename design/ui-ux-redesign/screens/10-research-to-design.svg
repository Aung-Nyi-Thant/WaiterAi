<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="960" viewBox="0 0 1440 960"><title>Research to Design</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F5F5F5"/><text x="56" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="550" letter-spacing="-1.0" fill="#141414" text-anchor="start">Decisions behind the interface</text><text x="56" y="124" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Secondary research translated into decisions for Shop AI · 22 October 2026</text><path d="M56 155 L1384 155" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="56" y="209" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Navigation should be recognizable.</text><text x="56" y="240" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">NN/g · Icon usability</text><text x="56" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Label Menu, Ask AI, My picks and Staff.</text><text x="56" y="310" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Keep language visible; remove icon guessing.</text><path d="M56 383 L684 383" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="740" y="209" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Allergy information needs a handoff.</text><text x="740" y="240" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">Food Standards Agency / GOV.UK</text><text x="740" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Show written allergen data and missing-data states.</text><text x="740" y="310" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Carry the profile to picks and kitchen; confirm with staff.</text><path d="M740 383 L1368 383" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="56" y="431" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Waiting is part of the experience.</text><text x="56" y="462" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">NN/g · Response-time limits</text><text x="56" y="504" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Say “Checking the menu…” while work happens.</text><text x="56" y="532" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Keep browsing and calling staff available; avoid fake progress.</text><path d="M56 605 L684 605" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="740" y="431" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">A kitchen needs priorities, not decoration.</text><text x="740" y="462" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">Toast · KDS platform guide</text><text x="740" y="504" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Group New / Cooking / Ready; show age and table.</text><text x="740" y="532" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Keep allergy notes and the next action on the ticket.</text><path d="M740 605 L1368 605" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="56" y="653" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Touch and language need space.</text><text x="56" y="684" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">W3C · WCAG 2.2 / Internationalization</text><text x="56" y="726" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Use 44–56 px targets; 4.5:1 body contrast.</text><text x="56" y="754" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Allow Thai/Myanmar wrapping and extra line height.</text><path d="M56 827 L684 827" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="740" y="653" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Data quality is an owner’s task.</text><text x="740" y="684" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="start">Repository review + Square availability patterns</text><text x="740" y="726" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Put missing allergens beside the dish, with a clear fix.</text><text x="740" y="754" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Make availability a direct, clearly named control.</text><path d="M740 827 L1368 827" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="56" y="912" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Desk research, not usability-test results. See RESEARCH.md for links, rationale, limitations and a test plan.</text></svg>