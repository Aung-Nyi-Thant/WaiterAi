<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="960" viewBox="0 0 1440 960"><title>Design Foundations</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F5F5F5"/><text x="56" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="43" font-weight="550" letter-spacing="-1.075" fill="#141414" text-anchor="start">Black. White. A little depth.</text><text x="56" y="124" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">A quieter restaurant interface. Food, clear type and carefully placed glass.</text><path d="M56 157 L1384 157" fill="none" stroke="#DEDEDE" stroke-width="1"/><text x="56" y="205" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">The palette</text><rect x="56" y="232" width="194" height="91" rx="12" fill="#FFFFFF"/><text x="56" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">White / #FFFFFF</text><rect x="278" y="232" width="194" height="91" rx="12" fill="#F5F5F5" stroke="#DEDEDE" stroke-width="1"/><text x="278" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">Canvas / #F5F5F5</text><rect x="500" y="232" width="194" height="91" rx="12" fill="#141414"/><text x="500" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">Ink / #141414</text><rect x="722" y="232" width="194" height="91" rx="12" fill="#626262"/><text x="722" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">Secondary / #626262</text><rect x="944" y="232" width="194" height="91" rx="12" fill="#E8E8E8"/><text x="944" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">Notice / #E8E8E8</text><rect x="1166" y="232" width="194" height="91" rx="12" fill="#DEDEDE"/><text x="1166" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">Line / #DEDEDE</text><text x="56" y="419" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="550" letter-spacing="-0.7250000000000001" fill="#141414" text-anchor="start">Type carries the hierarchy.</text><text x="56" y="459" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Helvetica Neue / interface · Noto Sans Thai + Myanmar / localized text</text><text x="56" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">Body 16 / 24 · Labels 13 / 20 · Titles 24–34 · Staff table numbers 25+</text><text x="56" y="563" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Controls that say what happens</text><rect x="56" y="590" width="223" height="52" rx="8" fill="#151515"/><text x="157.5" y="621.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">Send to staff</text><g transform="translate(247 606.0) scale(0.8333333333333334)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></g><rect x="299" y="590" width="223" height="52" rx="8" fill="#EAEAEA"/><text x="400.5" y="621.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="middle">Ask AI</text><g transform="translate(490 606.0) scale(0.8333333333333334)" fill="none" stroke="#151515" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/></g><rect x="542" y="590" width="223" height="52" rx="8" fill="#FFFFFF" stroke="#DEDEDE" stroke-width="1"/><text x="643.5" y="621.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="middle">Call staff</text><g transform="translate(733 606.0) scale(0.8333333333333334)" fill="none" stroke="#151515" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/></g><rect x="789" y="598" width="180" height="36" rx="18.0" fill="#E8E8E8"/><text x="879.0" y="621.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="550" letter-spacing="0" fill="#303030" text-anchor="middle">Data not provided</text><rect x="990" y="598" width="130" height="36" rx="18.0" fill="#EEEEEE"/><text x="1055.0" y="621.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="550" letter-spacing="0" fill="#242424" text-anchor="middle">Sold out</text><rect x="1190" y="602" width="50" height="28" rx="6" fill="#FFFFFF"/><text x="1202" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="550" letter-spacing="0" fill="#141414" text-anchor="start">EN</text><g transform="translate(1222 610) scale(0.5)" fill="none" stroke="#141414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="1190" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">50 × 28 visual / 56 × 44 hit area</text><text x="56" y="702" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="550" letter-spacing="-0.625" fill="#141414" text-anchor="start">Compact controls. Intentional depth.</text><text x="56" y="748" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">44–56 px hit targets</text><text x="56" y="783" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">8 px spacing rhythm</text><text x="56" y="818" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Glass only where layers overlap</text><text x="503" y="748" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">One clear primary action</text><text x="503" y="783" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Icon + label navigation</text><text x="503" y="818" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Visible loading and recovery</text><text x="950" y="748" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Allergies are never “safe”</text><text x="950" y="783" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Picks need staff confirmation</text><text x="950" y="818" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Local scripts can grow vertically</text><text x="56" y="917" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Design concept · Demonstration values are illustrative. Components are shown as drawings, not a published library.</text></svg>