<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="960" viewBox="0 0 1440 960"><title>Interaction States</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F5F5F5"/><text x="56" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="550" letter-spacing="-1.0" fill="#141414" text-anchor="start">When service does not go to plan</text><text x="56" y="123" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Loading, recovery and uncertainty belong in the design.</text><path d="M56 154 L1384 154" fill="none" stroke="#DEDEDE" stroke-width="1"/><rect x="56" y="195" width="416" height="288" rx="12" fill="#FFFFFF"/><g transform="translate(78 217) scale(1.0)" fill="none" stroke="#141414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/></g><text x="78" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Checking the menu…</text><text x="78" y="306" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">Your question is being processed.</text><text x="78" y="330" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">You can keep browsing while I reply.</text><rect x="78" y="413" width="372" height="48" rx="8" fill="#151515"/><text x="264.0" y="442.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">Browse the menu</text><text x="78" y="393" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Call staff instead</text><rect x="512" y="195" width="416" height="288" rx="12" fill="#E8E8E8"/><g transform="translate(534 217) scale(1.0)" fill="none" stroke="#303030" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2zM12 9v5M12 17v1"/></g><text x="534" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#303030" text-anchor="start">Showing a saved menu</text><text x="534" y="306" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#303030" text-anchor="start">Prices or availability may have changed.</text><text x="534" y="330" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#303030" text-anchor="start">Reconnect before sending picks.</text><rect x="534" y="413" width="372" height="48" rx="8" fill="#151515"/><text x="720.0" y="442.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">Try reconnecting</text><rect x="968" y="195" width="416" height="288" rx="12" fill="#FFFFFF"/><g transform="translate(990 217) scale(1.0)" fill="none" stroke="#141414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/></g><text x="990" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">No dishes match</text><text x="990" y="306" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">Try another search or clear your filters.</text><text x="990" y="330" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">Your allergy profile will stay applied.</text><rect x="990" y="413" width="372" height="48" rx="8" fill="#151515"/><text x="1176.0" y="442.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">Clear search and filters</text><rect x="56" y="543" width="416" height="288" rx="12" fill="#EEEEEE"/><g transform="translate(78 565) scale(1.0)" fill="none" stroke="#242424" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2zM12 9v5M12 17v1"/></g><text x="78" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#242424" text-anchor="start">Could not confirm delivery</text><text x="78" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#242424" text-anchor="start">Your picks may already have reached staff.</text><text x="78" y="678" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#242424" text-anchor="start">Please check before sending them again.</text><rect x="78" y="761" width="372" height="48" rx="8" fill="#FFFFFF" stroke="#DEDEDE" stroke-width="1"/><text x="264.0" y="790.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#151515" text-anchor="middle">Call staff</text><rect x="512" y="543" width="416" height="288" rx="12" fill="#E8E8E8"/><g transform="translate(534 565) scale(1.0)" fill="none" stroke="#303030" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2zM12 9v5M12 17v1"/></g><text x="534" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#303030" text-anchor="start">Allergen information missing</text><text x="534" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#303030" text-anchor="start">We cannot check this dish against your</text><text x="534" y="678" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#303030" text-anchor="start">profile. Please speak with the staff.</text><rect x="534" y="761" width="372" height="48" rx="8" fill="#151515"/><text x="720.0" y="790.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">Call staff</text><rect x="968" y="543" width="416" height="288" rx="12" fill="#FFFFFF"/><g transform="translate(990 565) scale(1.0)" fill="none" stroke="#141414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/></g><text x="990" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#141414" text-anchor="start">Sold out today</text><text x="990" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">This dish cannot be added right now.</text><text x="990" y="678" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#141414" text-anchor="start">Browse the menu for another option.</text><rect x="990" y="761" width="372" height="48" rx="8" fill="#151515"/><text x="1176.0" y="790.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="middle">See available dishes</text><text x="56" y="906" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#626262" text-anchor="start">Design behavior: never stream unvalidated model claims; do not fake completion percentages or retry orders blindly.</text></svg>