name: CI

# Every push and every pull request: install, lint, type-check, unit + eval tests, build, end-to-end tests,
# and a check that the Docker image still builds. The AI model is never needed: tests mock it, and the
# rule-based answers (all safety-critical ones) are scored offline against eval/questions.json.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]          # the app needs Node 22.13+ (built-in SQLite)
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit, integration and offline AI eval tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end tests (real server)
        run: npm run test:e2e

  windows:
    name: Windows (build, tests, helper scripts)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, lint, type-check, test, build, end-to-end
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e
      # The scripts in windows/ are for beginners' laptops: check that they parse in Windows PowerShell 5.1 and in
      # PowerShell 7, and run their safe test modes (nothing is installed or downloaded).
      - name: Windows scripts parse (PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host ($f.Name + ': ' + $_.Message) }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Windows scripts parse (PowerShell 7)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host ($f.Name + ': ' + $_.Message) }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: check-windows.ps1
        shell: powershell
        run: ./windows/check-windows.ps1 -NoPause
      - name: setup-windows.ps1 (dry run)
        shell: powershell
        run: ./windows/setup-windows.ps1 -DryRun -SkipAI -NoPause
      - name: start.ps1 (checks only)
        shell: powershell
        run: ./windows/start.ps1 -CheckOnly -NoPause
      - name: prepare-offline-pack.ps1 (dry run)
        shell: powershell
        run: ./windows/prepare-offline-pack.ps1 -DryRun -NoPause
      - name: install-from-offline-pack.ps1 (dry run, empty pack)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\pack | Out-Null
          ./windows/install-from-offline-pack.ps1 -Pack $env:RUNNER_TEMP\pack -DryRun -NoPause
      - name: stop.ps1 and reset-data.ps1
        shell: powershell
        run: |
          ./windows/stop.ps1 -NoPause
          ./windows/reset-data.ps1 -Yes -NoPause

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shop-ai .
